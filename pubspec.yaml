  cloud_firestore: ^4.15.5
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  provider: ^6.1.1
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  percent_indicator: ^4.2.3
  lottie: ^2.7.0
  # Phase 3
  connectivity_plus: ^5.0.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3
